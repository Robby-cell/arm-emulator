name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # Triggers release job on version tags
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: arm_emulator-linux.tar.gz
            binary_name: arm_emulator
            grader_asset_name: arm_grader-linux.tar.gz
            grader_binary_name: arm_auto_grader
            package_script: package.sh
            venv_activate: .venv/bin/activate
          - os: macos-latest
            asset_name: arm_emulator-macos.tar.gz
            binary_name: arm_emulator
            grader_asset_name: arm_grader-macos.tar.gz
            grader_binary_name: arm_auto_grader
            package_script: package.sh
            venv_activate: .venv/bin/activate
          - os: windows-latest
            asset_name: arm_emulator-windows.zip
            binary_name: arm_emulator.exe
            grader_asset_name: arm_grader-windows.zip
            grader_binary_name: arm_auto_grader.exe
            package_script: package-windows.sh
            venv_activate: .venv/Scripts/activate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Version Substitution Script
        # If triggered by a tag (v1.0.0), use the tag name. Otherwise, fallback to v0.0.0 for normal commits.
        run: |
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}"
          python scripts/update_version.py "$TAG_NAME"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Cargo tests
        run: cargo test --all

      - name: Create Virtual Environment
        run: uv venv

      - name: Build Rust bindings (Required for PyInstaller to see the module)
        run: uvx maturin develop --release

      - name: Sync dependencies
        run: uv sync

      - name: Build Translations
        run: bash build-translations.sh

      - name: Package GUI Executable
        shell: bash
        run: |
          source ${{ matrix.venv_activate }}
          bash ${{ matrix.package_script }}

      # Package the Python Auto-Grader into a Binary
      - name: Package Auto-Grader Binary
        shell: bash
        run: |
          source ${{ matrix.venv_activate }}
          uv run pyinstaller --onefile \
            --name arm_auto_grader \
            --additional-hooks-dir=hooks \
            auto_grader.py

      - name: Archive artifacts for Linux and macOS
        if: runner.os != 'Windows'
        run: |
          # Archive GUI
          cd dist
          tar -czf ../${{ matrix.asset_name }} ${{ matrix.binary_name }}
          # Archive Grader
          tar -czf ../${{ matrix.grader_asset_name }} ${{ matrix.grader_binary_name }}

      - name: Archive artifacts for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Archive GUI
          cd dist
          7z a ../${{ matrix.asset_name }} ${{ matrix.binary_name }}
          # Archive Grader
          7z a ../${{ matrix.grader_asset_name }} ${{ matrix.grader_binary_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.grader_asset_name }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release AND push commits
    steps:
      # Checkout the 'main' branch (not the detached tag) so we can push back to it
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main 

      # Setup Python to run the update script
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Run the script to update README.md
      - name: Update README.md
        run: |
          python scripts/update_version.py "${{ github.ref_name }}"

      # Commit and Push the updated README back to GitHub
      - name: Commit and Push changes
        run: |
          # Setup the Git bot identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md version_info.txt

          # Only commit if there are actual changes (prevents failing if already up-to-date)
          git diff --quiet && git diff --staged --quiet || \
          (git commit -m "docs: auto-update README and version_info to ${{ github.ref_name }} [skip ci]" && git push origin main)

      # Download the artifacts generated by the matrix build jobs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Create the GitHub Release and attach the downloaded assets
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
